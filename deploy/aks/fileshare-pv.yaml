apiVersion: v1
kind: PersistentVolume
metadata:
  name: data-volume
  labels:
    app: spatial
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  volumeMode: Filesystem
  mountOptions:
    - nconnect=4
    - noresvport
    - actimeo=30
  csi:
    driver: file.csi.azure.com
    volumeHandle: "spatial-fileshares#spatialstorage001#fileshares"
    volumeAttributes:
      protocol: nfs
      encryptInTransit: "true"
      resourceGroup: spatial-fileshares
      storageAccount: spatialstorage001
      shareName: fileshares
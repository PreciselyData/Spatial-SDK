apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels:
    app: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
      annotations:
    spec:
      containers:
        - name: keycloak
          image: "quay.io/keycloak/keycloak:26.8.1"
          imagePullPolicy: Always
          command: ["/opt/keycloak/bin/kc.sh", "start-dev"]
          env:
            - name: KEYCLOAK_ADMIN
              value: {{ .Values.adminUser | quote }}
            - name: KEYCLOAK_ADMIN_PASSWORD
              value: {{ .Values.adminPassword | quote }}
            {{- if .Values.hostname }}
            - name: KC_HOSTNAME
              value: {{ .Values.hostname | quote }}
            {{- else }}
            - name: KC_HOSTNAME_STRICT
              value: "false"
            - name: KC_PROXY_HEADERS
              value: xforwarded
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_HOSTNAME_STRICT_HTTPS
              value: "false"
            {{ end }}
            - name: KC_HTTP_RELATIVE_PATH
              value: "/auth"
          ports:
            - containerPort: 8080
              name: tcp
              protocol: TCP
          {{- if .Values.persistent.pvc }}
          volumeMounts:
            - name: keycloak-data
              mountPath: /opt/keycloak/data
          {{ end }}
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
            limits:
              cpu: 2
              memory: 1Gi
      {{- if .Values.persistent.pvc }}
      volumes:
        - name: keycloak-data
          persistentVolumeClaim:
            claimName: {{ .Values.persistent.pvc }}
      securityContext:
        fsGroup: 1000
      {{ end }}
              
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: keycloak
  name: keycloak-service
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: 8080
  selector:
    app: keycloak
 
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak-ingress
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /auth
        pathType: Prefix
        backend:
          service:
            name: keycloak-service
            port:
              number: 8080
  {{- if .Values.hostname }}
    host: {{ .Values.hostname | quote }}
  {{ end }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  labels:
    app: mongo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
      annotations:
        spatial.build: {{ .Values.build | default .Chart.Version | quote }}
    spec:
      containers:
        - name: mongo
          image: "mongo:{{ .Values.image.tag }}"
          imagePullPolicy: Always
          command:
            - /bin/sh
            - -c
            - "sleep 10 && exec mongod --replSet rs0 --bind_ip_all --port 27017"
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    until mongosh --quiet --eval "db.adminCommand('ping')" >/dev/null 2>&1; do
                      sleep 1
                    done
                    mongosh --quiet --eval '
                      try {
                        rs.status();
                      } catch (err) {
                        const res = rs.initiate({
                          _id: "rs0",
                          members: [{ _id: 0, host: "127.0.0.1:27017" }]
                        });
                        if (res.ok !== 1) { quit(1); }
                      }
                    '
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: "{{ .Values.credentials.rootUsername }}"
            - name: MONGO_INITDB_ROOT_PASSWORD
              value: "{{ .Values.credentials.rootPassword }}"
          ports:
            - containerPort: 27017
              name: tcp
              protocol: TCP
          volumeMounts:
            {{- if .Values.persistent.pvc }}
            - name: mongodb
              mountPath: /data/db
              subPath: mongodb/db
            - name: mongodb
              mountPath: /data/configdb
              subPath: mongodb/configdb
            {{ else }}
            - name: mongo-data
              mountPath: /data/db
            - name: mongo-config
              mountPath: /data/configdb
            {{ end }}
          resources:
            requests:
              cpu: {{ .Values.resources.requestCPU }}
              memory: {{ .Values.resources.requestMemory }}
            limits:
              {{- if .Values.resources.limitCPU }}
              cpu: {{ .Values.resources.limitCPU }}
              {{- end }}
              memory: {{ .Values.resources.limitMemory }}
          startupProbe:
            exec:
              command:
                - mongosh
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: 27017
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 27017
            periodSeconds: 2
            timeoutSeconds: 1
            successThreshold: 1
            failureThreshold: 2
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh","-c","sleep 15"]
      volumes:
        {{- if .Values.persistent.pvc }}
        - name: mongodb
          persistentVolumeClaim:
            claimName: {{ .Values.persistent.pvc }}
        {{ else }}
        - name: mongo-data
          emptyDir: {}
        - name: mongo-config
          emptyDir: {}
        {{- end }}
      terminationGracePeriodSeconds: 60
